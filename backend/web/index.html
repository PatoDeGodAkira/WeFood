<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WeFood • Delivery local</title>
<style>
:root{--bg:#140c29;--panel:#24163d;--panel2:#32204f;--yellow:#ffc928;--purple:#8750d6;--muted:#b7aacd;--white:#fff;--green:#62cf96;--red:#ff7373}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--white);font:15px Inter,system-ui,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:11px 16px;background:var(--yellow);color:#201333;font-weight:750}button.secondary{background:var(--panel2);color:white;border:1px solid #594675}button.danger{background:#592c45;color:#fff}button:disabled{opacity:.45;cursor:not-allowed}input,select,textarea{width:100%;padding:12px;border-radius:11px;background:#1b1130;color:white;border:1px solid #594675;margin:5px 0 12px}label{font-size:12px;color:var(--muted)}.shell{max-width:1250px;margin:auto;padding:22px}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:24px}.brand{font-weight:950;font-size:28px;letter-spacing:-1px}.brand span{color:var(--yellow)}.muted{color:var(--muted)}.layout{display:grid;grid-template-columns:220px 1fr;gap:20px}.side,.panel,.card{background:var(--panel);border:1px solid #392853;border-radius:18px;padding:18px}.side button{display:block;width:100%;text-align:left;margin:5px 0;background:transparent;color:var(--muted)}.side button.active,.side button:hover{background:var(--panel2);color:var(--yellow)}h1{font-size:25px;margin:0 0 8px}h2{font-size:18px;margin:0 0 15px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:13px}.metric{font-size:28px;font-weight:850;color:var(--yellow);margin-top:7px}.card{padding:16px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.stack{display:grid;gap:14px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pill{font-size:11px;padding:5px 9px;border-radius:30px;background:#46345f;color:#eee}.pill.green{background:#1d5b48}.pill.red{background:#63313d}.hidden{display:none!important}.auth{max-width:480px;margin:7vh auto}.auth .panel{padding:28px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid #46345f}.item:last-child{border:0}.item p{margin:4px 0;color:var(--muted);font-size:13px}.actions{display:flex;gap:7px;flex-wrap:wrap}.toast{position:fixed;bottom:20px;right:20px;background:#35234f;padding:13px 18px;border-radius:12px;box-shadow:0 8px 35px #0008;z-index:5}.empty{padding:35px;text-align:center;color:var(--muted)}.small{font-size:12px}.table{width:100%;border-collapse:collapse}.table td,.table th{text-align:left;padding:10px;border-bottom:1px solid #46345f;font-size:13px}
@media(max-width:760px){.layout{grid-template-columns:1fr}.side{display:flex;overflow:auto;gap:5px}.side button{white-space:nowrap;width:auto}.shell{padding:14px}.formgrid{grid-template-columns:1fr}.top{align-items:flex-start}}
</style></head><body>
<div class="shell">
<header class="top"><div><div class="brand">we<span>food</span>.</div><div class="muted small">Seu delivery, funcionando de verdade no seu computador</div></div><div id="userbox" class="hidden row"><span id="who" class="muted"></span><button class="secondary" onclick="logout()">Sair</button></div></header>
<section id="auth" class="auth"><div class="panel">
<h1 id="authTitle">Entre no WeFood</h1><p class="muted">Acesse como cliente, restaurante, entregador ou administrador.</p>
<div class="tabs"><button class="secondary" onclick="authMode('login')">Entrar</button><button class="secondary" onclick="authMode('register')">Criar conta</button></div>
<div id="loginForm"><label>E-mail</label><input id="loginEmail" type="email" value="admin@wefood.local"><label>Senha</label><input id="loginPass" type="password" value="admin123"><button onclick="login()">Entrar</button><p class="muted small">Admin inicial: admin@wefood.local / admin123<br>Entregador demonstração: entregador@wefood.local / 123456</p></div>
<div id="registerForm" class="hidden"><label>Nome</label><input id="regName" placeholder="Seu nome"><label>E-mail</label><input id="regEmail" type="email" placeholder="voce@email.com"><label>Telefone</label><input id="regPhone" placeholder="(19) 99999-9999"><label>Senha (mínimo 6 caracteres)</label><input id="regPass" type="password"><label>Tipo de conta</label><select id="regRole" onchange="toggleReg()"><option value="CLIENT">Cliente</option><option value="RESTAURANT">Restaurante</option><option value="COURIER">Entregador</option></select>
<div id="restaurantFields" class="hidden"><label>Nome do restaurante</label><input id="regRestaurant" placeholder="Nome da loja"><label>Cidade</label><input id="regCity" value="Campinas"><label>Endereço</label><input id="regAddress" placeholder="Rua, número, bairro"><label>Taxa de entrega</label><input id="regFee" type="number" step=".01" value="5.99"></div>
<div id="courierFields" class="hidden"><label>Veículo</label><select id="regVehicle"><option>Moto</option><option>Bicicleta</option><option>Carro</option></select><label>Placa</label><input id="regPlate"></div><button onclick="register()">Criar minha conta</button></div>
</div></section>
<section id="app" class="hidden"><div class="layout"><nav class="side" id="nav"></nav><main class="stack" id="content"></main></div></section>
</div><div id="toast" class="toast hidden"></div>
<script>
const API='/api';let token=localStorage.getItem('wf_token')||'';let me=null;let currentRestaurant=null;let cart=[];let restaurants=[];
const $=id=>document.getElementById(id);const money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
async function req(path,method='GET',body){let r=await fetch(API+path,{method,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},body:body?JSON.stringify(body):undefined});let d=await r.json();if(!r.ok)throw Error(d.error||'Falha na operação');return d}
function toast(t){$('toast').textContent=t;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),3000)}
function authMode(m){$('loginForm').classList.toggle('hidden',m!=='login');$('registerForm').classList.toggle('hidden',m!=='register');$('authTitle').textContent=m==='login'?'Entre no WeFood':'Crie sua conta'}
function toggleReg(){let r=$('regRole').value;$('restaurantFields').classList.toggle('hidden',r!=='RESTAURANT');$('courierFields').classList.toggle('hidden',r!=='COURIER')}
async function login(){try{let d=await req('/auth/login','POST',{email:$('loginEmail').value,password:$('loginPass').value});token=d.token;localStorage.setItem('wf_token',token);me=d.user;start()}catch(e){toast(e.message)}}
async function register(){try{let role=$('regRole').value;let d=await req('/auth/register','POST',{name:$('regName').value,email:$('regEmail').value,phone:$('regPhone').value,password:$('regPass').value,role,restaurant_name:$('regRestaurant').value,city:$('regCity').value,address:$('regAddress').value,fee:$('regFee').value,vehicle:$('regVehicle').value,plate:$('regPlate').value});token=d.token;localStorage.setItem('wf_token',token);me=d.user;start()}catch(e){toast(e.message)}}
async function logout(){try{await req('/auth/logout','POST')}catch{}token='';me=null;localStorage.removeItem('wf_token');$('app').classList.add('hidden');$('auth').classList.remove('hidden');$('userbox').classList.add('hidden')}
async function start(){try{me=await req('/me');$('auth').classList.add('hidden');$('app').classList.remove('hidden');$('userbox').classList.remove('hidden');$('who').textContent=me.name+' • '+roleName(me.role);buildNav();go(defaultPage())}catch(e){logout()}}
function roleName(r){return {ADMIN:'Administrador',CLIENT:'Cliente',RESTAURANT:'Restaurante',COURIER:'Entregador'}[r]||r}
function defaultPage(){return me.role==='ADMIN'?'overview':me.role==='CLIENT'?'discover':me.role==='RESTAURANT'?'store':'delivery'}
function buildNav(){let pages=me.role==='ADMIN'?[['overview','Visão geral'],['restaurants','Restaurantes'],['couriers','Entregadores'],['orders','Pedidos'],['users','Usuários']]:me.role==='CLIENT'?[['discover','Restaurantes'],['orders','Meus pedidos']]:me.role==='RESTAURANT'?[['store','Minha loja'],['menu','Cardápio'],['orders','Pedidos']]:[['delivery','Entregas']];$('nav').innerHTML=pages.map(([p,n])=>`<button data-page="${p}" onclick="go('${p}')">${n}</button>`).join('')}
function navActive(p){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p))}
async function go(page){navActive(page);try{if(page==='overview')await overview();if(page==='discover')await discover();if(page==='orders')await orders();if(page==='restaurants')await adminRestaurants();if(page==='couriers')await couriers();if(page==='users')await users();if(page==='store')await store();if(page==='menu')await menu();if(page==='delivery')await delivery()}catch(e){$('content').innerHTML=`<div class="panel"> <h2>Não foi possível carregar</h2><p class="muted">${e.message}</p></div>`}}
async function overview(){let s=await req('/admin/summary');$('content').innerHTML=`<div><h1>Painel administrativo</h1><p class="muted">Resumo atualizado a partir do banco de dados local.</p></div><div class="grid">${[['Clientes',s.clients],['Restaurantes',s.restaurants],['Entregadores',s.couriers],['Pedidos',s.orders],['Volume de pedidos',money(s.revenue)]].map(([a,b])=>`<div class="card"><div class="muted">${a}</div><div class="metric">${b}</div></div>`).join('')}</div><div class="panel"><h2>Fluxo operacional</h2><p class="muted">Cliente faz o pedido → restaurante aceita e prepara → administrador atribui um entregador → entregador retira e entrega.</p><button onclick="go('orders')">Acompanhar pedidos</button></div>`}
async function discover(){restaurants=await req('/restaurants');$('content').innerHTML=`<div><h1>Peça sua próxima refeição</h1><p class="muted">Escolha uma loja e adicione produtos ao carrinho.</p></div><div class="grid">${restaurants.map(r=>`<div class="card"><div class="row"><b>${esc(r.name)}</b><span class="pill ${r.is_open?'green':'red'}">${r.is_open?'Aberto':'Fechado'}</span></div><p class="muted">${esc(r.description||'')}</p><p class="small muted">${esc(r.city)} • ${money(r.fee)} entrega</p><button ${!r.is_open?'disabled':''} onclick="openRestaurant(${r.id})">Ver cardápio</button></div>`).join('')}</div><div class="panel"><h2>Seu carrinho <span class="pill">${cart.reduce((a,b)=>a+b.quantity,0)} itens</span></h2><div id="cartList"></div><div class="formgrid"><div><label>Endereço de entrega</label><input id="orderAddress" placeholder="Rua, número, bairro"></div><div><label>Pagamento (simulado)</label><select id="payMethod"><option>PIX</option><option>DINHEIRO</option><option>CARTAO_CREDITO</option></select></div></div><button onclick="checkout()">Confirmar pedido</button></div>`;renderCart()}
async function openRestaurant(id){try{currentRestaurant=await req('/restaurants/'+id);let ps=await req('/restaurants/'+id+'/products');$('content').innerHTML=`<div class="row"><div><h1>${esc(currentRestaurant.name)}</h1><p class="muted">${esc(currentRestaurant.description)}</p></div><button class="secondary" onclick="go('discover')">Voltar</button></div><div class="grid">${ps.filter(p=>p.available).map(p=>`<div class="card"><b>${esc(p.name)}</b><p class="muted">${esc(p.description)}</p><div class="row"><b>${money(p.price)}</b><button onclick="addCart(${p.id},${esc(JSON.stringify(p.name))},${p.price},${currentRestaurant.id})">Adicionar</button></div></div>`).join('')}</div><div class="panel"><h2>Carrinho</h2><div id="cartList"></div><label>Endereço de entrega</label><input id="orderAddress" placeholder="Rua, número, bairro"><label>Pagamento</label><select id="payMethod"><option>PIX</option><option>DINHEIRO</option><option>CARTAO_CREDITO</option></select><button onclick="checkout()">Finalizar pedido</button></div>`;renderCart()}catch(e){toast(e.message)}}
function addCart(id,name,price,rid){if(cart.length&&cart[0].restaurant_id!==rid){if(!confirm('O carrinho só pode ter itens de um restaurante. Limpar e continuar?'))return;cart=[]}let x=cart.find(i=>i.product_id===id);if(x)x.quantity++;else cart.push({product_id:id,name,price,quantity:1,restaurant_id:rid});renderCart();toast('Adicionado ao carrinho')}
function renderCart(){let el=$('cartList');if(!el)return;let sub=cart.reduce((a,b)=>a+b.price*b.quantity,0);el.innerHTML=cart.length?cart.map(x=>`<div class="item"><div><b>${esc(x.name)}</b><p>${x.quantity} × ${money(x.price)}</p></div><div class="actions"><button class="secondary" onclick="qty(${x.product_id},-1)">−</button><button class="secondary" onclick="qty(${x.product_id},1)">+</button></div></div>`).join('')+`<p><b>Subtotal: ${money(sub)}</b></p>`:'<p class="muted">Carrinho vazio.</p>'}
function qty(id,n){let x=cart.find(i=>i.product_id===id);if(x){x.quantity+=n;if(x.quantity<=0)cart=cart.filter(i=>i!==x)}renderCart()}
async function checkout(){try{if(!cart.length)throw Error('Adicione produtos ao carrinho.');let rid=cart[0].restaurant_id;let d=await req('/orders','POST',{restaurant_id:rid,items:cart.map(x=>({product_id:x.product_id,quantity:x.quantity})),address:$('orderAddress')?.value||'Endereço de teste, Campinas',payment_method:$('payMethod')?.value||'PIX'});cart=[];toast('Pedido '+d.code+' criado!');go('orders')}catch(e){toast(e.message)}}
async function orders(){let os=await req('/orders');$('content').innerHTML=`<div><h1>${me.role==='RESTAURANT'?'Pedidos da loja':me.role==='ADMIN'?'Todos os pedidos':'Meus pedidos'}</h1><p class="muted">Atualize o andamento das operações.</p></div>${os.length?os.map(o=>`<div class="card"><div class="row"><div><b>${o.code} • ${esc(o.restaurant||'')}</b><p class="muted small">${esc(o.client||'Cliente')} • ${new Date(o.created_at+'Z').toLocaleString('pt-BR')}</p></div><span class="pill">${statusName(o.status)}</span></div><div class="row"><b>${money(o.total)}</b><span class="muted small">${esc(o.address)}</span></div><div class="actions">${orderActions(o)}</div></div>`).join(''):'<div class="panel empty">Nenhum pedido cadastrado ainda.</div>'}`}
function orderActions(o){if(me.role==='RESTAURANT'||me.role==='ADMIN'){let opts={RECEBIDO:['PREPARANDO','CANCELADO'],PREPARANDO:['PRONTO'],PRONTO:[],SAIU_PARA_ENTREGA:[],ENTREGUE:[],CANCELADO:[]}[o.status]||[];return opts.map(s=>`<button onclick="setStatus(${o.id},'${s}')">${s==='PREPARANDO'?'Iniciar preparo':s==='PRONTO'?'Marcar pronto':s==='CANCELADO'?'Cancelar':'Atualizar'}</button>`).join('')+(o.status==='PRONTO'&&me.role==='ADMIN'?`<button class="secondary" onclick="assignPrompt(${o.id})">Atribuir entregador</button>`:'')}
if(me.role==='COURIER')return o.status==='PRONTO'?`<button onclick="setStatus(${o.id},'SAIU_PARA_ENTREGA')">Retirar e iniciar entrega</button>`:o.status==='SAIU_PARA_ENTREGA'?`<button onclick="setStatus(${o.id},'ENTREGUE')">Confirmar entrega</button>`:'';
return `<span class="muted small">Acompanhe as atualizações do restaurante e da entrega.</span>`}
function statusName(s){return ({RECEBIDO:'Recebido',PREPARANDO:'Em preparo',PRONTO:'Pronto',SAIU_PARA_ENTREGA:'Saiu para entrega',ENTREGUE:'Entregue',CANCELADO:'Cancelado'})[s]||s}
async function setStatus(id,status){try{await req('/orders/'+id+'/status','PATCH',{status});toast('Pedido atualizado');go('orders')}catch(e){toast(e.message)}}
async function assignPrompt(id){try{let ds=await req('/couriers');let av=ds.filter(d=>d.available);if(!av.length)throw Error('Não há entregadores disponíveis.');let choice=prompt('Digite o ID do entregador disponível:\n'+av.map(d=>`${d.id} - ${d.name}`).join('\n'),av[0].id);if(choice){await req('/orders/'+id+'/assign','PATCH',{courier_id:Number(choice)});toast('Entregador atribuído');go('orders')}}catch(e){toast(e.message)}}
async function adminRestaurants(){let rs=await req('/admin/restaurants');$('content').innerHTML=`<div class="row"><div><h1>Restaurantes</h1><p class="muted">Lojas cadastradas no sistema.</p></div><button onclick="newRestaurant()">+ Cadastrar</button></div>${rs.map(r=>`<div class="card row"><div><b>${esc(r.name)}</b><p class="muted small">${esc(r.city)} • ${money(r.fee)} entrega</p></div><span class="pill ${r.is_open?'green':'red'}">${r.is_open?'Aberto':'Fechado'}</span></div>`).join('')}`}
async function newRestaurant(){let name=prompt('Nome do restaurante:');if(!name)return;try{await req('/admin/restaurants','POST',{name,city:prompt('Cidade:','Campinas'),address:prompt('Endereço:',''),fee:Number(prompt('Taxa de entrega:','5.99')||0)});toast('Restaurante cadastrado');go('restaurants')}catch(e){toast(e.message)}}
async function couriers(){let ds=await req('/couriers');$('content').innerHTML=`<div class="row"><div><h1>Entregadores</h1><p class="muted">Disponibilidade e cadastro de entregadores.</p></div><button onclick="newCourier()">+ Cadastrar entregador</button></div>${ds.map(d=>`<div class="card row"><div><b>${esc(d.name)}</b><p class="muted small">${esc(d.vehicle)} • ${esc(d.plate||'Sem placa')} • ${esc(d.phone||'')}</p></div><span class="pill ${d.available?'green':'red'}">${d.available?'Disponível':'Indisponível'}</span></div>`).join('')}`}
async function newCourier(){let name=prompt('Nome:');if(!name)return;let email=prompt('E-mail de acesso:');if(!email)return;let password=prompt('Senha inicial (mínimo 6 caracteres):');if(!password)return;try{await req('/couriers','POST',{name,email,password,phone:prompt('Telefone:',''),vehicle:prompt('Veículo:','Moto'),plate:prompt('Placa:',''),available:true});toast('Entregador cadastrado com acesso ao sistema');go('couriers')}catch(e){toast(e.message)}}
async function users(){let us=await req('/admin/users');$('content').innerHTML=`<h1>Usuários</h1><p class="muted">Contas cadastradas por tipo de acesso.</p><div class="panel"><table class="table"><thead><tr><th>Nome</th><th>E-mail</th><th>Perfil</th></tr></thead><tbody>${us.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${roleName(u.role)}</td></tr>`).join('')}</tbody></table></div>`}
async function store(){let rs=await req('/restaurants');let mine=rs.find(r=>r.owner_id===me.id);if(!mine){$('content').innerHTML='<div class="panel"><h1>Cadastre sua loja</h1><label>Nome</label><input id="sName"><label>Descrição</label><input id="sDesc"><label>Cidade</label><input id="sCity" value="Campinas"><label>Endereço</label><input id="sAddress"><label>Taxa de entrega</label><input id="sFee" type="number" value="5.99"><button onclick="createStore()">Cadastrar loja</button></div>';return}currentRestaurant=mine;$('content').innerHTML=`<div class="row"><div><h1>${esc(mine.name)}</h1><p class="muted">Painel do restaurante</p></div><span class="pill ${mine.is_open?'green':'red'}">${mine.is_open?'Aberto':'Fechado'}</span></div><div class="panel"><h2>Disponibilidade da loja</h2><button onclick="toggleStore(${mine.id},${!mine.is_open})">${mine.is_open?'Fechar loja':'Abrir loja'}</button><button class="secondary" onclick="go('menu')">Gerenciar cardápio</button><button class="secondary" onclick="go('orders')">Ver pedidos</button></div>`}
async function createStore(){try{await req('/auth/register','POST',{});toast('Use o cadastro de conta Restaurante na tela inicial para vincular sua loja.')}catch(e){toast('A loja é criada junto com a conta de restaurante. Faça logout e cadastre uma conta Restaurante.')}}
async function toggleStore(id,v){try{await req('/restaurants/'+id+'/open','PATCH',{is_open:v});go('store')}catch(e){toast(e.message)}}
async function menu(){let rs=await req('/restaurants');let mine=rs.find(r=>r.owner_id===me.id);if(!mine){$('content').innerHTML='<div class="panel">Cadastre sua loja primeiro.</div>';return}currentRestaurant=mine;let ps=await req('/restaurants/'+mine.id+'/products');$('content').innerHTML=`<div class="row"><div><h1>Cardápio</h1><p class="muted">${esc(mine.name)}</p></div><button onclick="newProduct()">+ Adicionar produto</button></div>${ps.map(p=>`<div class="card row"><div><b>${esc(p.name)}</b><p class="muted small">${esc(p.category)} • ${money(p.price)}</p></div><div class="actions"><span class="pill ${p.available?'green':'red'}">${p.available?'Disponível':'Pausado'}</span><button class="secondary" onclick="toggleProduct(${p.id},${!p.available})">${p.available?'Pausar':'Ativar'}</button></div></div>`).join('')}`}
async function newProduct(){let name=prompt('Nome do produto:');if(!name)return;try{await req('/restaurants/'+currentRestaurant.id+'/products','POST',{name,description:prompt('Descrição:',''),category:prompt('Categoria:','Outros'),price:Number(prompt('Preço:','20'))});toast('Produto adicionado');go('menu')}catch(e){toast(e.message)}}
async function toggleProduct(id,v){try{await req('/products/'+id,'PATCH',{available:v});go('menu')}catch(e){toast(e.message)}}
async function delivery(){let ds=await req('/courier/orders');$('content').innerHTML=`<div><h1>Minhas entregas</h1><p class="muted">Pedidos atribuídos à sua conta de entregador.</p></div><div class="panel"><button class="secondary" onclick="toggleAvailability()">Alternar disponibilidade</button></div>${ds.length?ds.map(o=>`<div class="card"><b>${o.code} • ${esc(o.restaurant)}</b><p class="muted">${esc(o.address)} • ${money(o.total)}</p><span class="pill">${statusName(o.status)}</span><div class="actions">${o.status==='PRONTO'?`<button onclick="setStatus(${o.id},'SAIU_PARA_ENTREGA')">Retirar e iniciar entrega</button>`:o.status==='SAIU_PARA_ENTREGA'?`<button onclick="setStatus(${o.id},'ENTREGUE')">Confirmar entrega</button>`:''}</div></div>`).join(''):'<div class="panel empty">Nenhuma entrega atribuída. Aguarde o administrador.</div>'}`}
async function toggleAvailability(){try{let v=confirm('Ficar disponível para receber entregas?');await req('/courier/availability','PATCH',{available:v});toast('Disponibilidade atualizada')}catch(e){toast(e.message)}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function js(s){return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'")}
if(token)start();
</script></body></html>
